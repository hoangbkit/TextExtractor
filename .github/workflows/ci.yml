name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: text-extractor-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS package + demo
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Toolchain info
        run: |
          swift --version
          xcodebuild -version

      - name: Validate package manifest
        run: swift package dump-package > /dev/null

      - name: Run package tests
        run: swift test --parallel

      - name: Build package (release)
        run: swift build -c release

      - name: Build demo app
        run: |
          xcodebuild \
            -scheme TextExtractorDemo \
            -project Examples/TextExtractorDemo/TextExtractorDemo.xcodeproj \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/TextExtractorDemoDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
